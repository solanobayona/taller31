<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cohen Sutherland</title>
    <style>

    body{
        margin:0;
        padding:20px;

        font-family:Arial;

        display:flex;
        gap:20px;

        background:#f0f0f0;
    }

    canvas{
        border:1px solid black;
        background:white;
    }

    input{
        width:60px;
        margin:5px;
    }

    button{
        padding:5px 10px;
        margin:3px;
    }

</style>
</head>

<body>

    <!-- Canvas principal -->
    <canvas id="canvas" width="700" height="500"></canvas>

    <!-- Panel lateral -->
<div>

    <h2>Ventana de recorte</h2>

    <div>
        x1 <input type="number" id="xmin" value="150">
        y1 <input type="number" id="ymin" value="100">
    </div>

    <div>
        x2 <input type="number" id="xmax" value="500">
        y2 <input type="number" id="ymax" value="350">
    </div>

    <button id="updateBtn">
        Actualizar
    </button>

    <br><br>

    <button id="firstBtn">|&lt;</button>
    <button id="prevBtn">&lt;</button>
    <button id="nextBtn">&gt;</button>
    <button id="lastBtn">&gt;|</button>

</div>

    <script src="script.js"></script>

</body>

</html>
