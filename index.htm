<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cohen Sutherland</title>
    <style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center; /* Centrado horizontal */
    align-items: center;     /* Centrado vertical */
    min-height: 100vh;      /* Ocupa toda la altura de la ventana */
    gap: 40px;
    background: #e5e7eb;
}

.container { 
    display: flex;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    gap: 30px;
}

canvas {
    border: 2px solid #374151;
    border-radius: 4px;
    background: #ffffff;
}
</style>
</head>

<body>

    <!-- Canvas principal -->
    <canvas id="canvas" width="700" height="500"></canvas>

    <!-- Panel lateral -->
<div>

    <h2>Ventana de recorte</h2>

    <div>
        x1 <input type="number" id="xmin" value="150">
        y1 <input type="number" id="ymin" value="100">
    </div>

    <div>
        x2 <input type="number" id="xmax" value="500">
        y2 <input type="number" id="ymax" value="350">
    </div>

    <button id="updateBtn">
        Actualizar
    </button>

    <br><br>

    <button id="firstBtn">|&lt;</button>
    <button id="prevBtn">&lt;</button>
    <button id="nextBtn">&gt;</button>
    <button id="lastBtn">&gt;|</button>

</div>

    <script src="script.js"></script>

</body>

</html>
